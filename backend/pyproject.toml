[project]
name = "mmm-refresh"
version = "0.1.0"
description = "Monthly Model Refresh — mapping, alignment and decomposition engine"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "databricks-sql-connector>=3.0",
    "openpyxl>=3.1",
]
dev = ["pytest>=7.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
