<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapping Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#f6f7f9; --surface:#fff; --surface-2:#f3f5f8; --ink:#1b212c; --muted:#68717e; --faint:#9aa2af;
    --line:#e9ecf1; --line-2:#f0f2f6;
    --accent:#4f5bd5; --accent-2:#6a76e6; --accent-soft:#eceefb; --accent-ink:#3a45b8;
    --ok:#2f9e6b; --ok-soft:#e8f5ee; --warn:#bf8a2c; --warn-soft:#f8f0dd; --bad:#cf5a4f; --bad-soft:#fbeae7;
    --blue:#3566c7; --blue-soft:#e6eefb;
    --shadow:0 1px 2px rgba(27,33,44,.05),0 4px 16px rgba(27,33,44,.06);
    --sans:"Public Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace; --r:11px;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0c0f15; --surface:#141922; --surface-2:#10141d; --ink:#e6e9f0; --muted:#98a1b1; --faint:#656e7f;
    --line:#232a36; --line-2:#1a212b; --accent:#7e8bf2; --accent-2:#949fff; --accent-soft:#1a2039; --accent-ink:#aab4ff;
    --ok:#44bc85; --ok-soft:#102a1c; --warn:#d8a449; --warn-soft:#2e2411; --bad:#e8726a; --bad-soft:#331a18;
    --blue:#7ea2ef; --blue-soft:#172338; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 18px rgba(0,0,0,.3); color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#0c0f15; --surface:#141922; --surface-2:#10141d; --ink:#e6e9f0; --muted:#98a1b1; --faint:#656e7f;
    --line:#232a36; --line-2:#1a212b; --accent:#7e8bf2; --accent-2:#949fff; --accent-soft:#1a2039; --accent-ink:#aab4ff;
    --ok:#44bc85; --ok-soft:#102a1c; --warn:#d8a449; --warn-soft:#2e2411; --bad:#e8726a; --bad-soft:#331a18;
    --blue:#7ea2ef; --blue-soft:#172338; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 18px rgba(0,0,0,.3); color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
  .mono{font-family:var(--mono)} .tnum{font-variant-numeric:tabular-nums} .muted{color:var(--muted)}
  h1,h2,h3{margin:0}
  button{font-family:inherit;cursor:pointer}
  .wrap{padding:14px max(14px,env(safe-area-inset-right)) 14px max(14px,env(safe-area-inset-left));max-width:1360px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
  .bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:11px 15px}
  .brand{display:flex;align-items:center;gap:10px}
  .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(145deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:#fff}
  .brand b{font-size:14.5px;font-weight:700;letter-spacing:-.01em;display:block;line-height:1.1}
  .brand span{font-size:11px;color:var(--muted)}
  .sep{width:1px;height:26px;background:var(--line)}
  .pick{display:inline-flex;align-items:center;gap:7px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-weight:600;font-size:13px}
  .pick small{color:var(--faint);font-weight:600;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase}
  .grow{flex:1}
  .env{font-size:11px;font-weight:700;color:var(--warn);background:var(--warn-soft);padding:3px 9px;border-radius:999px}
  .icon{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center}
  .icon:hover{color:var(--ink)}
  .commit{display:inline-flex;align-items:center;gap:7px;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:9px 14px;font-weight:600;font-size:13px}
  .tabs{display:flex;gap:4px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:5px}
  .tab{display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:8px;border:none;background:transparent;color:var(--muted);font-weight:600;font-size:13px}
  .tab .n{font-size:11px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--muted)}
  .tab.on{background:var(--accent-soft);color:var(--accent-ink)} .tab.on .n{background:transparent;border-color:transparent}
  .summary{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:11px 13px;cursor:pointer}
  .tile.active{outline:2px solid var(--accent);outline-offset:-1px}
  .tile .t{font-size:11px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
  .tile .v{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:1px}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
  .toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:10px 13px}
  .search{display:inline-flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 11px;flex:1;min-width:180px}
  .search input{border:none;background:transparent;color:var(--ink);font-family:inherit;font-size:13px;outline:none;width:100%}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:12px;font-weight:600;color:var(--muted)}
  .chip.on{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink)}
  .selwrap{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
  select{font-family:inherit;font-size:12.5px;font-weight:600;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
  .btn{display:inline-flex;align-items:center;gap:7px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:600}
  .btn.key{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink)}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
  .gscroll{overflow-x:auto}
  table{border-collapse:collapse;width:100%;min-width:960px;font-size:13px}
  thead th{text-align:left;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:10px 14px;white-space:nowrap;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:1;cursor:pointer;user-select:none}
  thead th.nosort{cursor:default}
  thead th .ar{opacity:.5;margin-left:3px}
  tbody td{padding:9px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
  tbody tr.main:hover{background:var(--surface-2)}
  tbody tr.conflict{box-shadow:inset 3px 0 0 var(--bad)}
  .vcell{display:flex;align-items:center;gap:9px;min-width:0}
  .cat{width:7px;height:7px;border-radius:50%;flex:none}
  .cat.media{background:var(--accent)} .cat.btl{background:#7a8bbf} .cat.sales{background:var(--ok)} .cat.dummy{background:var(--warn)} .cat.constant{background:var(--faint)} .cat.other{background:var(--faint)}
  .vname{font-weight:600;font-size:12.5px;white-space:nowrap}
  .vtok{font-family:var(--mono);font-size:10.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px;display:block}
  .reg{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
  .reg.multi{font-family:var(--sans);color:var(--accent-ink);font-weight:600}
  .type{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
  .type.split,.type.aggregate{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink)}
  .type.unmapped{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
  .type.skip{background:var(--surface-2);color:var(--faint)}
  .conf{display:flex;align-items:center;gap:9px;min-width:116px}
  .conf .tr{flex:1;height:6px;border-radius:999px;background:var(--line);overflow:hidden}
  .conf .tr i{display:block;height:100%}
  .conf b{font-size:12px;font-weight:600;width:30px;text-align:right}
  .st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
  .st .d{width:8px;height:8px;border-radius:50%}
  .st.suggested{color:var(--ok)} .st.suggested .d{background:var(--ok)}
  .st.review{color:var(--warn)} .st.review .d{background:var(--warn)}
  .st.unmapped{color:var(--bad)} .st.unmapped .d{background:var(--bad)}
  .st.confirmed{color:var(--blue)} .st.confirmed .d{background:var(--blue)}
  .prov{font-size:11px;color:var(--muted);font-weight:500}
  .warnpill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;color:var(--bad);background:var(--bad-soft);padding:2px 7px;border-radius:999px;margin-left:6px}
  .rowbtns{display:flex;gap:4px;justify-content:flex-end}
  .mini{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center}
  .mini:hover{color:var(--ink);background:var(--surface-2)}
  .mini.ok{color:var(--ok)} .mini.ok:hover{background:var(--ok-soft)}
  .caret{transition:transform .15s} .caret.open{transform:rotate(90deg)}
  tr.detail td{padding:0;border-bottom:1px solid var(--line-2);background:var(--surface-2)}
  .detwrap{padding:12px 16px 14px 40px;display:flex;flex-direction:column;gap:8px}
  .detwrap h4{margin:0;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);font-weight:700}
  .targ{display:flex;align-items:center;gap:12px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
  .targ.off{opacity:.5}
  .targ .rg{flex:0 0 150px}
  .spark{height:22px}
  .targ .w{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
  .targ .badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px}
  .badge.on{color:var(--ok);background:var(--ok-soft)} .badge.zero{color:var(--faint);background:var(--surface-2)}
  .detnote{font-size:11.5px;color:var(--muted)}
  .scrim{position:fixed;inset:0;background:rgba(10,13,20,.45);opacity:0;pointer-events:none;transition:opacity .18s;z-index:40}
  .scrim.open{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(480px,94vw);background:var(--surface);border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(0,0,0,.18);transform:translateX(100%);transition:transform .2s;z-index:41;display:flex;flex-direction:column}
  .drawer.open{transform:none}
  .dh{display:flex;align-items:flex-start;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
  .dh h3{font-size:14px;font-weight:700} .dh .vtok{max-width:320px;margin-top:3px}
  .dbody{padding:16px 18px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:16px}
  .dfoot{padding:13px 18px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end}
  .fld label{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:700;margin-bottom:6px}
  .seg{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:4px;flex-wrap:wrap}
  .seg button{flex:1;min-width:70px;border:none;background:transparent;color:var(--muted);font-weight:600;font-size:12.5px;padding:7px 8px;border-radius:6px}
  .seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
  .input{width:100%;font-family:inherit;font-size:13px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
  .trow{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);margin-bottom:7px}
  .trow .rg{flex:1;font-family:var(--mono);font-size:12px}
  .trow .pctin{width:84px}
  .switch{position:relative;width:38px;height:22px;flex:none}
  .switch input{opacity:0;width:0;height:0}
  .slider{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.15s}
  .slider:before{content:"";position:absolute;height:16px;width:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
  .switch input:checked+.slider{background:var(--ok)} .switch input:checked+.slider:before{transform:translateX(16px)}
  .sumline{font-size:12px;font-weight:600;display:flex;justify-content:space-between;padding:6px 2px}
  .sumline.bad{color:var(--bad)} .sumline.ok{color:var(--ok)}
  .hint{font-size:11.5px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
  .ghost{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:9px 15px;font-weight:600;font-size:13px}
  .save{background:var(--accent);border:none;color:#fff;border-radius:8px;padding:9px 17px;font-weight:600;font-size:13px}
  .tsel{font-family:var(--mono);font-size:11.5px;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:5px 7px;color:var(--ink)}
  .foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--muted);padding:2px 4px}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-weight:600;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:50}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .overlay{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:60;color:var(--muted);font-weight:600;gap:12px;flex-direction:column}
  .spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .viewnav{display:flex;gap:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:3px}
  .vn{border:none;background:transparent;color:var(--muted);font-weight:600;font-size:12.5px;padding:7px 13px;border-radius:7px}
  .vn.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
  .ins-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .ins-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:12px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:15px 16px}
  .card .ch{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .card h3{font-size:13px;font-weight:700}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .bar-row .nm{flex:0 0 180px;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar-row .nm .mono{font-size:10px;color:var(--faint);display:block}
  .bar-row .bg{flex:1;height:13px;background:var(--surface-2);border-radius:5px;overflow:hidden}
  .bar-row .bg i{display:block;height:100%;background:var(--accent);border-radius:5px}
  .bar-row .val{width:78px;text-align:right;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
  table.roi{width:100%;border-collapse:collapse;font-size:12.5px}
  table.roi th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);padding:7px 8px;border-bottom:1px solid var(--line)}
  table.roi td{padding:7px 8px;border-bottom:1px solid var(--line-2)}
  table.roi .r{color:var(--ok);font-weight:700;font-family:var(--mono)}
  .trendsvg{display:block;width:100%;height:auto}
  @media (max-width:980px){ .summary{grid-template-columns:repeat(3,1fr)} .ins-grid{grid-template-columns:1fr} .ins-tiles{grid-template-columns:repeat(2,1fr)} }
  @media (max-width:560px){ .summary{grid-template-columns:repeat(2,1fr)} }
</style>
</head>
<body>
<div class="overlay" id="overlay">
  <div class="card" style="width:min(420px,92vw);display:flex;flex-direction:column;gap:12px">
    <h3 style="font-size:15px">Open a mapping workspace</h3>
    <div class="fld"><label>Environment</label><select id="pEnv" style="width:100%"></select></div>
    <div class="fld"><label>Brand · Market (BMC)</label><select id="pBmc" style="width:100%"></select></div>
    <div class="fld"><label>Model refresh</label><select id="pRefresh" style="width:100%"></select></div>
    <div id="pErr" style="color:var(--bad);font-size:12px;min-height:14px"></div>
    <button class="commit" id="pOpen" style="width:100%;justify-content:center">Open workspace</button>
  </div>
</div>
<div class="wrap" id="app" style="display:none">
  <header class="bar">
    <div class="brand">
      <div class="logo"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 7h8M4 12h12M4 17h7"/><circle cx="18" cy="8" r="2.1" fill="currentColor" stroke="none"/><circle cx="19" cy="16" r="2.1" fill="currentColor" stroke="none"/></svg></div>
      <div><b>Refresh Studio</b><span>Mapping &amp; alignment</span></div>
    </div>
    <div class="sep"></div>
    <div class="viewnav"><button class="vn on" data-view="mapping">Mapping</button><button class="vn" data-view="insights">Insights</button></div>
    <div class="sep"></div>
    <span class="pick"><small>BMC</small> <span id="hBmc">—</span></span>
    <span class="pick"><small>Refresh</small> <span id="hRefresh">—</span></span>
    <div class="grow"></div>
    <span class="env" id="hEnv">DEV</span>
    <button class="icon" id="theme" title="Theme"><svg id="thi" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M21 12.8A8 8 0 1 1 11.2 3a6.2 6.2 0 0 0 9.8 9.8z"/></svg></button>
    <button class="commit" id="commitBtn"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 6L9 17l-5-5"/></svg>Commit mapping</button>
  </header>
  <div id="mappingView">
  <div class="tabs" id="tabs"></div>
  <div class="summary" id="summary"></div>
  <div class="toolbar">
    <div class="search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--faint)" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      <input id="q" placeholder="Search variable name or token…"></div>
    <div class="chips" id="actionChips"></div>
    <div class="selwrap">Sort
      <select id="sort">
        <option value="conf-asc">Confidence ↑ (review first)</option>
        <option value="conf-desc">Confidence ↓</option>
        <option value="status">Status</option>
        <option value="name">Name A–Z</option>
      </select>
    </div>
    <button class="btn" id="reviewQ">Review queue</button>
    <button class="btn key" id="acceptAll"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 6L9 17l-5-5"/></svg>Accept suggested</button>
  </div>
  <div class="panel">
    <div class="gscroll">
      <table>
        <thead><tr>
          <th class="nosort" style="width:30px"></th>
          <th data-sort="name">Source variable<span class="ar"></span></th>
          <th class="nosort">Region</th>
          <th class="nosort">Maps to</th>
          <th data-sort="type">Type<span class="ar"></span></th>
          <th data-sort="conf">Confidence<span class="ar"></span></th>
          <th data-sort="status">Status<span class="ar"></span></th>
          <th class="nosort">Source</th>
          <th class="nosort" style="width:96px"></th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="foot"><span id="count"></span><span id="align"></span></div>
  </div>
  </div>
  <div id="insightsView" style="display:none"></div>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Edit mapping"></aside>
<div class="toast" id="toast"></div>

<script>
(function(){
  var API="";
  async function jpost(u,b){var r=await fetch(API+u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{})});if(!r.ok)throw new Error(u+" "+r.status);return r.json();}
  async function jget(u){var r=await fetch(API+u);if(!r.ok)throw new Error(u+" "+r.status);return r.json();}
  async function jpatch(u,b){var r=await fetch(API+u,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});if(!r.ok)throw new Error(u+" "+r.status);return r.json();}

  /* theme */
  var root=document.documentElement,tbtn=document.getElementById('theme'),ic=document.getElementById('thi');
  var SUN='M12 4V2M12 22v-2M4 12H2M22 12h-2M6 6 4.5 4.5M19.5 19.5 18 18M18 6l1.5-1.5M4.5 19.5 6 18M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z',MOON='M21 12.8A8 8 0 1 1 11.2 3a6.2 6.2 0 0 0 9.8 9.8z';
  function dark(){var t=root.getAttribute('data-theme');return t?t==='dark':matchMedia('(prefers-color-scheme:dark)').matches;}
  function paintT(){ic.setAttribute('d',dark()?SUN:MOON);}
  try{var s=localStorage.getItem('rs-theme');if(s)root.setAttribute('data-theme',s);}catch(e){} paintT();
  tbtn.onclick=function(){var n=dark()?'light':'dark';root.setAttribute('data-theme',n);try{localStorage.setItem('rs-theme',n)}catch(e){}paintT();};

  var SESSION=null,DOMAIN="raw_to_processed",ROWS=[],ANALYSIS=null,DOMAIN_COUNTS={},SUBS=["Access","Multivitaminicos","Others","Select"];
  var state={q:"",action:"all",statusFilter:null,sort:"conf-asc",reviewOnly:false,expanded:{}};

  var DOMAIN_LABEL={raw_to_processed:"Raw → Processed",processing_detail_to_processed:"Processing detail → Processed",contribution_to_processed:"Contribution → Processed"};

  function humanize(v){
    var majors=v.split("__"); var cat=majors[0];
    var tail=majors[majors.length-1].replace(/_/g," ").replace(/-/g," ");
    var sb=(v.match(/sub-brand-([a-z0-9&-]+)/i)||[])[1];
    var lab=cat.charAt(0).toUpperCase()+cat.slice(1)+" · "+tail+(sb?(" · "+sb):"");
    return lab.length>52?lab.slice(0,51)+"…":lab;
  }
  function adapt(p,i){
    return {id:i,cat:p.category,label:humanize(p.source_var),svar:p.source_var,sreg:p.source_region,
      action:p.action,kind:p.kind,conf:p.confidence,prov:p.provenance,status:p.status,
      agg:p.action==="aggregate"?p.sources.map(function(s){return s.var;}):null,
      targets:(p.targets||[]).map(function(t){return {var:t.var,region:t.region,active:t.active,percent:t.percent,weight:t.weight,series:t.series};})};
  }
  function rowToProposal(r){
    var sources=r.agg?r.agg.map(function(v){return {var:v,region:r.sreg};}):[{var:r.svar,region:r.sreg}];
    return {sources:sources,action:r.action,targets:r.targets.map(function(t){return {var:t.var,region:t.region,percent:t.percent,weight:t.weight};}),
      confidence:r.conf,provenance:r.prov,status:r.status};
  }

  function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},1900);}

  var $=function(id){return document.getElementById(id);};
  function opts(arr){return (arr&&arr.length?arr:[""]).map(function(v){return '<option value="'+v.replace(/"/g,'&quot;')+'">'+(v||'(none)')+'</option>';}).join('');}
  async function populateEnvs(){
    try{ var envs=await jget("/environments");
      $('pEnv').innerHTML=envs.map(function(e){return '<option value="'+e.name+'">'+e.name.toUpperCase()+'</option>';}).join('');
    }catch(e){ $('pErr').innerHTML="Can’t reach the backend. Make sure the app is running. ("+e.message+")"; return; }
    await populateBmcs();
  }
  async function populateBmcs(){
    $('pBmc').innerHTML='<option>loading…</option>'; $('pErr').textContent='';
    try{ var r=await jget("/bmcs?env="+encodeURIComponent($('pEnv').value)); $('pBmc').innerHTML=opts(r.bmcs); }
    catch(e){ $('pBmc').innerHTML='<option value="">(error)</option>'; }
    await populateRefreshes();
  }
  async function populateRefreshes(){
    $('pRefresh').innerHTML='<option>loading…</option>';
    try{ var r=await jget("/refreshes?env="+encodeURIComponent($('pEnv').value)+"&bmc="+encodeURIComponent($('pBmc').value)); $('pRefresh').innerHTML=opts(r.refreshes); }
    catch(e){ $('pRefresh').innerHTML='<option value="">(error)</option>'; }
  }
  async function openWorkspace(){
    var env=$('pEnv').value, bmc=$('pBmc').value, refresh=$('pRefresh').value;
    if(!bmc||!refresh){ $('pErr').textContent='Pick a BMC and a refresh.'; return; }
    $('pOpen').textContent='Opening…'; $('pErr').textContent='';
    try{
      var sum=await jpost("/sessions",{env:env,bmc:bmc,refresh:refresh});
      SESSION=sum.id;ANALYSIS=sum.analysis;DOMAIN_COUNTS={};INSIGHTS=null;
      $('hBmc').textContent=sum.bmc.replace("_"," · ");
      $('hRefresh').textContent=sum.refresh;
      $('hEnv').textContent=(sum.env||env).toUpperCase();
      Object.keys(sum.domains).forEach(function(d){DOMAIN_COUNTS[d]=sum.domains[d].total;});
      DOMAIN=Object.keys(DOMAIN_COUNTS).indexOf(DOMAIN)>=0?DOMAIN:Object.keys(DOMAIN_COUNTS)[0];
      await loadDomain(DOMAIN);
      $('overlay').style.display="none"; $('app').style.display="flex";
    }catch(e){ $('pErr').textContent='Could not open: '+e.message; $('pOpen').textContent='Open workspace'; }
  }
  function initPicker(){
    $('pEnv').onchange=populateBmcs; $('pBmc').onchange=populateRefreshes; $('pOpen').onclick=openWorkspace;
    populateEnvs();
  }
  async function loadDomain(d){DOMAIN=d;var m=await jget("/sessions/"+SESSION+"/mapping/"+d);ROWS=m.proposals.map(adapt);state.expanded={};rerender();}
  async function pushAndAnalyze(){var res=await jpatch("/sessions/"+SESSION+"/mapping/"+DOMAIN,{proposals:ROWS.map(rowToProposal)});ANALYSIS=res.analysis;INSIGHTS=null;renderAlign();}

  /* render helpers */
  function confColor(c){return c>=0.92?"var(--ok)":c>=0.6?"var(--warn)":"var(--bad)";}
  function esc(s){return (s+"").replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
  function sparkline(ser,active){
    if(!ser||!ser.length)return "";
    var w=70,h=20,mx=Math.max.apply(null,ser.concat([1e-9])),flat=mx<=1e-9;
    var pts=ser.map(function(v,i){return [i/(ser.length-1)*w,h-(v/(mx||1))*(h-3)-1.5];});
    var d=pts.map(function(p,i){return (i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1);}).join("");
    var col=active?confColor(1):"var(--faint)";
    return '<svg class="spark" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'">'+
      (flat?'<line x1="0" y1="'+(h-1.5)+'" x2="'+w+'" y2="'+(h-1.5)+'" stroke="var(--faint)" stroke-width="1.2" stroke-dasharray="2 2"/>'
           :'<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="1.6"/>')+'</svg>';
  }
  function dedupConflicts(){
    var byTarget={},conflicts={};
    ROWS.forEach(function(r){if(r.action==="unmapped"||r.action==="skip"||r.action==="aggregate")return;
      (r.targets||[]).forEach(function(t){if(!t.active&&t.percent<=0)return;var k=t.var+"|"+t.region;(byTarget[k]=byTarget[k]||[]).push(r.id);});});
    Object.keys(byTarget).forEach(function(k){if(byTarget[k].length>1)byTarget[k].forEach(function(id){conflicts[id]=true;});});
    return conflicts;
  }
  function visible(){
    var list=ROWS.slice();
    if(state.q){var q=state.q.toLowerCase();list=list.filter(function(r){return (r.label+" "+r.svar).toLowerCase().indexOf(q)>=0;});}
    if(state.action!=="all")list=list.filter(function(r){return r.action===state.action;});
    if(state.statusFilter)list=list.filter(function(r){return r.status===state.statusFilter;});
    if(state.reviewOnly)list=list.filter(function(r){return r.status==="review"||r.status==="unmapped";});
    var s=state.sort;
    list.sort(function(a,b){
      if(s==="conf-asc")return a.conf-b.conf; if(s==="conf-desc")return b.conf-a.conf;
      if(s==="name")return a.label.localeCompare(b.label);
      if(s==="status"){var o={review:0,unmapped:1,suggested:2,confirmed:3};return o[a.status]-o[b.status];}
      if(s==="type")return a.action.localeCompare(b.action); return 0;});
    return list;
  }
  function renderTabs(){
    document.getElementById('tabs').innerHTML=Object.keys(DOMAIN_COUNTS).map(function(d){
      return '<button class="tab'+(d===DOMAIN?' on':'')+'" data-dom="'+d+'">'+(DOMAIN_LABEL[d]||d)+' <span class="n">'+DOMAIN_COUNTS[d]+'</span></button>';}).join("");
  }
  function renderSummary(){
    var c={total:ROWS.length,suggested:0,review:0,unmapped:0,confirmed:0};
    ROWS.forEach(function(x){c[x.status]=(c[x.status]||0)+1;});
    var tiles=[["Total",c.total,"var(--muted)",null],["Confirmed",c.confirmed,"var(--blue)","confirmed"],["Suggested",c.suggested,"var(--ok)","suggested"],["Needs review",c.review,"var(--warn)","review"],["Unmapped",c.unmapped,"var(--bad)","unmapped"]];
    document.getElementById('summary').innerHTML=tiles.map(function(t){
      var on=state.statusFilter===t[3]&&t[3]!==null;
      return '<div class="tile'+(on?' active':'')+'" data-status="'+(t[3]||"")+'"><div class="t"><span class="dot" style="background:'+t[2]+'"></span>'+t[0]+'</div><div class="v tnum">'+t[1]+'</div></div>';}).join("");
  }
  function renderChips(){
    var acts=["all","direct","rename","split","aggregate","unmapped"];
    document.getElementById('actionChips').innerHTML=acts.map(function(a){return '<button class="chip'+(state.action===a?' on':'')+'" data-action="'+a+'">'+(a==="all"?"All types":a)+'</button>';}).join("");
  }
  function targetCell(r){
    if(r.action==="unmapped")return '<span class="reg muted">— unresolved —</span>';
    if(r.action==="aggregate")return '<div class="vname">'+esc(r.targets[0].var.split("__").slice(-1)[0])+'</div><span class="reg">'+esc(r.targets[0].region)+' · '+(r.agg?r.agg.length:1)+' sources</span>';
    var act=r.targets.filter(function(t){return t.active||t.percent>0;});
    if(r.action==="split"){var tag=r.kind||"split";return '<div class="reg multi">'+act.length+' of '+r.targets.length+' regions · '+tag+'</div><span class="reg">'+esc(r.targets[0].var.split("__").slice(-1)[0])+'</span>';}
    return '<div class="vname">'+esc(r.targets[0]?(r.targets[0].var===r.svar?"same name":r.targets[0].var.split("__").slice(-1)[0]):"—")+'</div><span class="reg">'+esc(r.targets[0]?r.targets[0].region:"")+'</span>';
  }
  function weightLabel(t){
    if(!t.active&&t.percent<=0)return 'weight 0';
    if(t.weight.kind==="rule")return t.weight.value.side+' '+t.weight.value.breakpoint;
    if(t.weight.kind==="vector")return 'time mask';
    return (t.weight.value===1?'×1 (replicate)':'×'+t.weight.value+' ('+t.percent+'%)');
  }
  function splitNote(r){
    if(r.kind==="temporal")return "Temporal split: routed by a dated breakpoint; a new month flows into the later regime automatically.";
    if(r.kind==="membership")return "By value: active regions carry the same series (replicated); zero regions get nothing.";
    if(r.kind==="varying")return "Active regions carry different values — flagged for review.";
    return "";
  }
  function renderRows(){
    var list=visible(),conf=dedupConflicts(),out="";
    list.forEach(function(r){
      var open=state.expanded[r.id],canExpand=(r.action==="split");
      out+='<tr class="main'+(conf[r.id]?' conflict':'')+'" data-id="'+r.id+'">'+
        '<td>'+(canExpand?'<svg class="caret'+(open?' open':'')+'" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--faint)" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg>':'')+'</td>'+
        '<td><div class="vcell"><span class="cat '+r.cat+'"></span><div><div class="vname">'+esc(r.label)+(conf[r.id]?'<span class="warnpill">⚠ dup target</span>':'')+'</div><span class="vtok">'+esc(r.svar)+'</span></div></div></td>'+
        '<td><span class="reg">'+esc(r.sreg)+'</span></td>'+
        '<td>'+targetCell(r)+'</td>'+
        '<td><span class="type '+r.action+'">'+r.action+(r.action==="split"&&r.kind?' · '+r.kind:'')+'</span></td>'+
        '<td><div class="conf"><div class="tr"><i style="width:'+Math.round(r.conf*100)+'%;background:'+confColor(r.conf)+'"></i></div><b>'+Math.round(r.conf*100)+'</b></div></td>'+
        '<td><span class="st '+r.status+'"><span class="d"></span>'+r.status+'</span></td>'+
        '<td><span class="prov">'+r.prov+'</span></td>'+
        '<td><div class="rowbtns">'+(r.status!=="confirmed"?'<button class="mini ok" data-act="accept" title="Accept"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6L9 17l-5-5"/></svg></button>':'')+
          '<button class="mini" data-act="edit" title="Edit mapping"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button></div></td></tr>';
      if(open&&canExpand){
        out+='<tr class="detail"><td colspan="9"><div class="detwrap"><h4>Split targets'+(r.kind==="temporal"&&r.breakpoint?' · breakpoint '+r.breakpoint:'')+'</h4>'+
          r.targets.map(function(t){var on=t.active||t.percent>0;return '<div class="targ'+(on?'':' off')+'"><span class="rg mono">'+esc(t.region)+'</span>'+sparkline(t.series,on)+'<span class="badge '+(on?'on':'zero')+'">'+(on?'active':'zero')+'</span><span class="w">'+weightLabel(t)+'</span></div>';}).join("")+
          '<div class="detnote">'+splitNote(r)+'</div></div></td></tr>';
      }
    });
    document.getElementById('rows').innerHTML=out||'<tr><td colspan="9" style="padding:26px;text-align:center;color:var(--muted)">No variables match these filters.</td></tr>';
    document.getElementById('count').textContent=list.length+' of '+ROWS.length+' variables';
    var nc=Object.keys(conf).length;
    var dd=nc?('<span style="color:var(--bad);font-weight:600">⚠ '+nc+' rows feed a duplicated target</span> · '):'';
    document.getElementById('count').insertAdjacentHTML('beforeend','');
    document.getElementById('align').innerHTML=dd+renderAlignText();
  }
  function renderAlignText(){
    if(!ANALYSIS)return "";
    var wd=ANALYSIS.weekly_deviation,mm=ANALYSIS.unaligned?ANALYSIS.unaligned.mismatch.length:0;
    var ok=wd.weeks_within_tol===wd.weeks_total&&mm===0;
    return '<span style="color:'+(ok?'var(--ok)':'var(--warn)')+';font-weight:600">'+(ok?'✓ aligned':'⚠ '+mm+' off')+'</span> · '+wd.weeks_within_tol+'/'+wd.weeks_total+' weeks within tol';
  }
  function renderAlign(){document.getElementById('align').innerHTML=renderAlignText();}

  /* editor */
  var editingId=null,draft=null;
  function openEditor(id){var r=ROWS.find(function(x){return x.id===id;});draft=JSON.parse(JSON.stringify(r));if(!draft.kind)draft.kind=draft.action==="split"?"membership":null;renderEditor();document.getElementById('scrim').classList.add('open');document.getElementById('drawer').classList.add('open');editingId=id;}
  function closeEditor(){document.getElementById('scrim').classList.remove('open');document.getElementById('drawer').classList.remove('open');editingId=null;}
  function ensureAllRegions(r){var present={};r.targets.forEach(function(t){present[t.region]=t;});return SUBS.map(function(sb){var reg="('"+sb+"',)";return present[reg]||{var:r.svar,region:reg,active:false,percent:0,weight:{kind:"scalar",value:0},series:null};});}
  function renderEditor(){
    var r=draft,actions=["direct","rename","split","aggregate","skip","unmapped"];
    var html='<div class="dh"><div style="flex:1"><h3>Edit mapping</h3><div class="vname" style="margin-top:4px">'+esc(r.label)+'</div><div class="vtok mono">'+esc(r.svar)+' · '+esc(r.sreg)+'</div></div><button class="icon" id="closeDrawer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div><div class="dbody">';
    html+='<div class="fld"><label>Action</label><div class="seg" id="actSeg">'+actions.map(function(a){return '<button class="'+(r.action===a?'on':'')+'" data-a="'+a+'">'+a+'</button>';}).join("")+'</div></div>';
    if(r.action==="split"){
      html+='<div class="fld"><label>How to split</label><div class="seg" id="kindSeg">'+[["membership","By presence"],["percentage","By percentage"],["temporal","By time"]].map(function(k){return '<button class="'+(r.kind===k[0]?'on':'')+'" data-k="'+k[0]+'">'+k[1]+'</button>';}).join("")+'</div></div>';
      if(r.kind==="membership"||r.kind==="varying"){
        var regs=ensureAllRegions(r);draft._regs=regs;
        html+='<div class="fld"><label>Active regions (carry the source value)</label>'+regs.map(function(t,i){var on=t.active||t.percent>0;return '<div class="trow"><span class="rg">'+esc(t.region)+'</span>'+sparkline(t.series,on)+'<label class="switch"><input type="checkbox" data-mem="'+i+'" '+(on?'checked':'')+'><span class="slider"></span></label></div>';}).join("")+'<div class="hint">Auto-detected by value: regions with the same non-zero series are active; zero regions are off. Toggle to override.</div></div>';
      }else if(r.kind==="percentage"){
        var regs2=ensureAllRegions(r);draft._regs=regs2;
        html+='<div class="fld"><label>Share per region</label>'+regs2.map(function(t,i){return '<div class="trow"><span class="rg">'+esc(t.region)+'</span><input class="input pctin tnum" type="number" min="0" max="100" step="1" data-pct="'+i+'" value="'+((t.active||t.percent>0)?t.percent:0)+'"><span class="muted">%</span></div>';}).join("")+'<div class="sumline" id="pctSum"></div><div class="hint">Enter explicit shares (must total 100%). Use only when you really want fixed fractions.</div></div>';
      }else if(r.kind==="temporal"){
        if(!r.breakpoint)r.breakpoint="2025-05-01";
        var regsT=r.targets.length>=2?r.targets.slice(0,2):ensureAllRegions(r).slice(0,2);
        regsT.forEach(function(t){if(!t.weight||t.weight.kind!=="rule"){t.weight={kind:"rule",value:{breakpoint:r.breakpoint,side:"after"}};t.active=true;t.percent=100;}});
        draft._regs=regsT;
        html+='<div class="fld"><label>Breakpoint date</label><input class="input" type="date" id="bpDate" value="'+r.breakpoint+'"></div><div class="fld"><label>Assign each target to a regime</label>'+regsT.map(function(t,i){var side=t.weight&&t.weight.value?t.weight.value.side:"after";return '<div class="trow"><span class="rg">'+esc(t.var.split("__").slice(-1)[0])+' · '+esc(t.region)+'</span>'+sparkline(t.series,true)+'<select class="tsel" data-side="'+i+'"><option value="before"'+(side==="before"?" selected":"")+'>before date</option><option value="after"'+(side==="after"?" selected":"")+'>on/after date</option></select></div>';}).join("")+'<div class="hint">Weeks before the date route to the “before” target, on/after to the “after” target. A new month lands in the on/after regime.</div></div>';
      }
    }else if(r.action==="rename"||r.action==="direct"){
      html+='<div class="fld"><label>Target variable</label><input class="input mono" id="tgtVar" value="'+esc(r.targets[0]?r.targets[0].var:r.svar)+'"></div><div class="fld"><label>Target region</label><input class="input mono" id="tgtReg" value="'+esc(r.targets[0]?r.targets[0].region:r.sreg)+'"></div>';
    }else if(r.action==="aggregate"){
      html+='<div class="fld"><label>Sources aggregated into one target</label><div class="hint">'+(r.agg||[r.svar]).map(esc).join("<br>")+'</div></div><div class="fld"><label>Target variable</label><input class="input mono" id="tgtVar" value="'+esc(r.targets[0]?r.targets[0].var:"")+'"></div>';
    }else if(r.action==="skip"){html+='<div class="hint">This source will be dropped (not mapped). Use for a redundant parent whose one-hot children are already mapped.</div>';}
    else{html+='<div class="hint">No confident match. Pick an action above to map it manually, or leave unmapped.</div>';}
    html+='</div><div class="dfoot"><button class="ghost" id="cancelEdit">Cancel</button><button class="save" id="saveEdit">Save mapping</button></div>';
    document.getElementById('drawer').innerHTML=html;wireEditor();
    if(r.action==="split"&&r.kind==="percentage")updatePctSum();
  }
  function wireEditor(){
    document.getElementById('closeDrawer').onclick=closeEditor;document.getElementById('cancelEdit').onclick=closeEditor;document.getElementById('saveEdit').onclick=saveEdit;
    var aseg=document.getElementById('actSeg');if(aseg)aseg.onclick=function(e){var b=e.target.closest('[data-a]');if(!b)return;draft.action=b.getAttribute('data-a');if(draft.action==="split"&&!draft.kind)draft.kind="membership";renderEditor();};
    var kseg=document.getElementById('kindSeg');if(kseg)kseg.onclick=function(e){var b=e.target.closest('[data-k]');if(!b)return;draft.kind=b.getAttribute('data-k');renderEditor();};
    document.querySelectorAll('[data-mem]').forEach(function(ch){ch.onchange=function(){draft._regs[+ch.getAttribute('data-mem')].active=ch.checked;};});
    document.querySelectorAll('[data-pct]').forEach(function(inp){inp.oninput=updatePctSum;});
    var bp=document.getElementById('bpDate');if(bp)bp.onchange=function(){draft.breakpoint=bp.value;};
  }
  function updatePctSum(){var sum=0;document.querySelectorAll('[data-pct]').forEach(function(inp){sum+=(+inp.value||0);});var el=document.getElementById('pctSum');if(!el)return;el.className='sumline '+(Math.abs(sum-100)<0.01?'ok':'bad');el.innerHTML='<span>Total</span><span>'+sum+'% '+(Math.abs(sum-100)<0.01?'✓':'(must be 100%)')+'</span>';}
  async function saveEdit(){
    var r=ROWS.find(function(x){return x.id===editingId;});
    r.action=draft.action;r.prov="manual";r.status="confirmed";r.conf=1.0;
    if(draft.action==="split"){
      r.kind=draft.kind==="varying"?"membership":draft.kind;
      if(draft.kind==="membership"||draft.kind==="varying"){
        r.targets=draft._regs.map(function(t){return {var:t.var,region:t.region,active:t.active,percent:t.active?100:0,weight:{kind:"scalar",value:t.active?1:0},series:t.series};});
      }else if(draft.kind==="percentage"){
        var inputs=document.querySelectorAll('[data-pct]');
        r.targets=draft._regs.map(function(t,i){var p=+inputs[i].value||0;return {var:t.var,region:t.region,active:p>0,percent:p,weight:{kind:"scalar",value:p/100},series:t.series};});
      }else if(draft.kind==="temporal"){
        r.breakpoint=draft.breakpoint;var sides=document.querySelectorAll('[data-side]');
        r.targets=draft._regs.map(function(t,i){var side=sides[i].value;return {var:t.var,region:t.region,active:true,percent:100,weight:{kind:"rule",value:{breakpoint:draft.breakpoint,side:side}},series:t.series};});
      }
    }else if(draft.action==="rename"||draft.action==="direct"){
      var tv=(document.getElementById('tgtVar')||{}).value||r.svar,tr=(document.getElementById('tgtReg')||{}).value||r.sreg;
      r.targets=[{var:tv,region:tr,active:true,percent:100,weight:{kind:"scalar",value:1},series:r.targets[0]?r.targets[0].series:null}];
    }else if(draft.action==="aggregate"){
      var tv2=(document.getElementById('tgtVar')||{}).value||'';r.targets=[{var:tv2,region:r.targets[0]?r.targets[0].region:r.sreg,active:true,percent:100,weight:{kind:"scalar",value:1},series:r.targets[0]?r.targets[0].series:null}];
    }else if(draft.action==="skip"||draft.action==="unmapped"){r.targets=[];if(draft.action==="unmapped"){r.status="unmapped";r.conf=0;}}
    closeEditor();rerender();
    try{await pushAndAnalyze();renderRows();toast("Mapping updated");}catch(e){toast("Save failed: "+e.message);}
  }

  /* insights view */
  var INSIGHTS=null;
  function setView(v){
    state.view=v;
    document.getElementById('mappingView').style.display=v==='mapping'?'':'none';
    document.getElementById('insightsView').style.display=v==='insights'?'':'none';
    document.querySelectorAll('.vn').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-view')===v);});
    if(v==='insights'&&!INSIGHTS)loadInsights();
  }
  async function loadInsights(){try{INSIGHTS=await jget('/sessions/'+SESSION+'/insights');renderInsights();}catch(e){toast('Insights failed: '+e.message);}}
  async function doExtend(){try{var r=await jpost('/sessions/'+SESSION+'/extend',{});toast('Extended +'+r.new_weeks+' weeks');INSIGHTS=null;await loadInsights();}catch(e){toast('Extend failed: '+e.message);}}
  function fmt(n){return n>=1000?(n/1000).toFixed(1)+'k':Math.round(n);}
  function short(v){return v.split('__').slice(-1)[0].replace(/_/g,' ');}
  function trendChart(dates,vals){
    var w=680,h=150,L=34,R=10,T=10,B=22,pw=w-L-R,ph=h-T-B,n=vals.length;
    var mx=Math.max.apply(null,vals.concat([1])),mn=Math.min.apply(null,vals.concat([0]));
    function X(i){return L+pw*(i/((n-1)||1));} function Y(v){return T+ph*(1-(v-mn)/((mx-mn)||1));}
    var d=vals.map(function(v,i){return (i?'L':'M')+X(i).toFixed(1)+','+Y(v).toFixed(1);}).join('');
    var ar=d+'L'+X(n-1).toFixed(1)+','+Y(mn).toFixed(1)+'L'+X(0).toFixed(1)+','+Y(mn).toFixed(1)+'Z';
    var ticks=[0,Math.floor(n/2),n-1].map(function(i){return '<text x="'+X(i)+'" y="'+(h-6)+'" font-size="9" fill="var(--faint)" text-anchor="middle" font-family="var(--mono)">'+(dates[i]||'').slice(5)+'</text>';}).join('');
    return '<svg class="trendsvg" viewBox="0 0 '+w+' '+h+'"><path d="'+ar+'" fill="var(--accent)" opacity="0.08"/><path d="'+d+'" fill="none" stroke="var(--accent)" stroke-width="1.8"/><circle cx="'+X(n-1)+'" cy="'+Y(vals[n-1])+'" r="3.2" fill="var(--accent)"/>'+ticks+'<text x="'+(L-5)+'" y="'+(Y(mx)+3)+'" font-size="9" fill="var(--faint)" text-anchor="end" font-family="var(--mono)">'+fmt(mx)+'</text></svg>';
  }
  function renderInsights(){
    var ins=INSIGHTS; if(!ins){document.getElementById('insightsView').innerHTML='<div class="card">Loading…</div>';return;}
    var topv=ins.by_variable.slice(0,7),maxc=Math.max.apply(null,ins.by_variable.map(function(r){return r.contribution;}).concat([1]));
    var maxr=Math.max.apply(null,ins.by_region.map(function(r){return r.contribution;}).concat([1]));
    var rois=ins.by_variable.filter(function(r){return r.roi!=null;}).slice(0,8);
    var scope=ins.scope==='combined'?'History + new month':'Historical only';
    var html='<div class="ins-tiles">'+
      '<div class="card"><div class="muted" style="font-size:11px;font-weight:600">Total contribution</div><div style="font-size:24px;font-weight:700" class="tnum">'+fmt(ins.total)+'</div></div>'+
      '<div class="card"><div class="muted" style="font-size:11px;font-weight:600">Scope</div><div style="font-size:15px;font-weight:700;margin-top:4px">'+scope+'</div><div class="muted" style="font-size:11px">'+ins.trend.dates.length+' weeks</div></div>'+
      '<div class="card"><div class="muted" style="font-size:11px;font-weight:600">Variables</div><div style="font-size:24px;font-weight:700" class="tnum">'+ins.by_variable.length+'</div></div>'+
      '<div class="card"><div class="muted" style="font-size:11px;font-weight:600">Top region</div><div style="font-size:15px;font-weight:700;margin-top:4px">'+(ins.by_region[0]?ins.by_region[0].region:'—')+'</div><div class="muted" style="font-size:11px">'+(ins.by_region[0]?ins.by_region[0].pct+'%':'')+'</div></div></div>';
    html+='<div class="ins-grid" style="margin-top:12px">';
    html+='<div class="card"><div class="ch"><h3>Top contributors</h3></div>'+topv.map(function(r){return '<div class="bar-row"><div class="nm">'+esc(short(r.var))+'<span class="mono">'+esc(r.region)+'</span></div><div class="bg"><i style="width:'+Math.round(r.contribution/maxc*100)+'%"></i></div><div class="val">'+fmt(r.contribution)+' · '+r.pct+'%</div></div>';}).join('')+'</div>';
    html+='<div class="card"><div class="ch"><h3>By region</h3></div>'+ins.by_region.map(function(r){return '<div class="bar-row"><div class="nm mono">'+esc(r.region)+'</div><div class="bg"><i style="width:'+Math.round(r.contribution/maxr*100)+'%"></i></div><div class="val">'+r.pct+'%</div></div>';}).join('')+'</div></div>';
    html+='<div class="card" style="margin-top:12px"><div class="ch"><h3>Contribution over time</h3><div class="grow"></div><button class="btn key" id="extendBtn"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>Extend +1 month</button></div>'+trendChart(ins.trend.dates,ins.trend.values)+'</div>';
    if(rois.length)html+='<div class="card" style="margin-top:12px"><div class="ch"><h3>ROI · contribution ÷ spend</h3></div><table class="roi"><thead><tr><th>Variable</th><th>Region</th><th>Contribution</th><th>Spend</th><th>ROI</th></tr></thead><tbody>'+rois.map(function(r){return '<tr><td>'+esc(short(r.var))+'</td><td class="mono">'+esc(r.region)+'</td><td class="tnum">'+fmt(r.contribution)+'</td><td class="tnum">'+fmt(r.invest)+'</td><td class="r">'+r.roi.toFixed(2)+'×</td></tr>';}).join('')+'</tbody></table></div>';
    document.getElementById('insightsView').innerHTML=html;
    var eb=document.getElementById('extendBtn');if(eb)eb.onclick=doExtend;
  }

  /* events */
  document.querySelectorAll('.vn').forEach(function(b){b.addEventListener('click',function(){setView(b.getAttribute('data-view'));});});
  document.getElementById('rows').addEventListener('click',function(e){
    var tr=e.target.closest('tr.main');if(!tr)return;var id=+tr.getAttribute('data-id');
    var act=e.target.closest('[data-act]');
    if(act){var a=act.getAttribute('data-act');
      if(a==="edit")openEditor(id);
      if(a==="accept"){var r=ROWS.find(function(x){return x.id===id;});if(r.status!=="unmapped"){r.status="confirmed";r.conf=Math.max(r.conf,1);}rerender();pushAndAnalyze();}
      return;}
    var r=ROWS.find(function(x){return x.id===id;});
    if(r&&r.action==="split"){state.expanded[id]=!state.expanded[id];renderRows();}
  });
  document.getElementById('summary').addEventListener('click',function(e){var t=e.target.closest('[data-status]');if(!t)return;var s=t.getAttribute('data-status');state.statusFilter=(state.statusFilter===s||s==="")?null:s;rerender();});
  document.getElementById('tabs').addEventListener('click',function(e){var b=e.target.closest('[data-dom]');if(!b)return;loadDomain(b.getAttribute('data-dom'));});
  document.getElementById('actionChips').addEventListener('click',function(e){var b=e.target.closest('[data-action]');if(!b)return;state.action=b.getAttribute('data-action');rerender();});
  document.getElementById('q').addEventListener('input',function(e){state.q=e.target.value;renderRows();});
  document.getElementById('sort').addEventListener('change',function(e){state.sort=e.target.value;renderRows();});
  document.getElementById('reviewQ').addEventListener('click',function(){state.reviewOnly=!state.reviewOnly;state.sort="conf-asc";document.getElementById('sort').value="conf-asc";this.classList.toggle('key',state.reviewOnly);rerender();});
  document.getElementById('acceptAll').addEventListener('click',function(){ROWS.forEach(function(r){if(r.status==="suggested")r.status="confirmed";});rerender();pushAndAnalyze();toast("Accepted all suggested");});
  document.getElementById('commitBtn').addEventListener('click',async function(){try{await pushAndAnalyze();await jpost("/sessions/"+SESSION+"/commit",{});toast("Mapping committed to baseline");}catch(e){toast("Commit failed: "+e.message);}});
  document.getElementById('scrim').addEventListener('click',closeEditor);
  document.querySelectorAll('thead th[data-sort]').forEach(function(th){th.addEventListener('click',function(){var k=th.getAttribute('data-sort');state.sort=k==="conf"?(state.sort==="conf-desc"?"conf-asc":"conf-desc"):(k==="status"?"status":k==="name"?"name":"type");var sel=document.getElementById('sort');if(["conf-asc","conf-desc","status","name"].indexOf(state.sort)>=0)sel.value=state.sort;renderRows();});});

  function rerender(){renderTabs();renderSummary();renderChips();renderRows();}
  initPicker();
})();
</script>
</body>
</html>
